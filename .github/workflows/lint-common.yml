name: Run @bookpoolcontexts/common lint
on:
  push:
    paths:
      - packages/common/src/**
  pull_request:
    paths:
      - packages/common/src/**
jobs:
  lint:
    name: Run lint
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Repo
        uses: actions/checkout@master

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10.17.1

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: tsc
        run: pnpm common lint:tsc
      
      - name: biome
        run: pnpm common lint:biome

      - name: cspell
        run: pnpm common lint:cspell
